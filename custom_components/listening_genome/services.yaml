import_lastfm:
  fields:
    max_pages:
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          mode: box
import_apple_csv:
  fields:
    path:
      required: true
      example: /media/Apple Music - Play History Daily Tracks.csv
      selector:
        text:
import_fork_export:
  fields:
    path:
      required: true
      example: /media/genome-export-20260926-120000.db
      selector:
        text:
    dry_run:
      default: false
      selector:
        boolean:
